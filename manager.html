<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日報檢視（主管）</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#dde2ea;--pri:#1f5fbf;--ok:#1b8a4b;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e6eaf0;--mute:#97a3b3;--line:#2c3643;--pri:#5b9bf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;flex:1;min-width:180px}header.top h1 small{display:block;font-weight:400;color:var(--mute);font-size:12px}
main{max-width:1400px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 12px;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--pri)}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.lgrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.lgrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);flex:1;min-width:200px}.lgrow input{width:100%}
.note{font-size:12px;color:var(--mute)}.err{color:var(--bad);font-size:13px;margin:6px 0}
/* 矩陣 */
.tblwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.mx thead th{position:sticky;top:0;background:var(--card);z-index:3;padding:3px 0;font-weight:600}
table.mx thead th small{display:block;font-weight:400;color:var(--mute);font-size:10px}
table.mx th.we,table.mx th.off{color:var(--mute)}
table.mx .nm{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;padding:3px 8px;min-width:116px;font-weight:600}
table.mx thead .nm{z-index:4}
table.mx .nm small{font-weight:400;color:var(--mute);margin-left:4px}
table.mx td.c{width:26px;min-width:26px;height:28px;cursor:pointer;font-size:11px}
table.mx td.sum{padding:0 8px;min-width:46px}
.st-done{background:#d9f2e3;color:#14532d}.st-leave{background:#e9defc;color:#3b1f78}.st-late{background:#fbd5d0;color:#7a1c12;font-weight:700}
.st-pend{background:#fff0c9;color:#6b4a00}.st-ot{background:#dbe9fb;color:#133c78}.st-off{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.04) 4px 8px);color:var(--mute)}
.st-na,.st-future{color:var(--mute)}
@media (prefers-color-scheme:dark){.st-done{background:#1d4430;color:#cdeedb}.st-leave{background:#352a58;color:#e3d9ff}.st-late{background:#561f1a;color:#ffd6d1}.st-pend{background:#4a3a10;color:#ffe8a8}.st-ot{background:#1c3556;color:#cfe2fb}}
.lv0{color:var(--ok)}.lv1{background:#fff0c9;color:#6b4a00}.lv2{background:#ffd9a8;color:#6b3300}.lv3{background:#fbd5d0;color:#7a1c12}.lv4{background:#7a1c4d;color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:-3px;text-align:center;font-style:normal;font-size:10px;line-height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chip{border-radius:12px;padding:1px 10px;font-size:12px;border:1px solid var(--line);cursor:pointer}
/* 明細視窗 */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px 18px;width:min(720px,95vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:16px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:8px 0;font-size:13px}.kv b{color:var(--mute);font-weight:400}
.it{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}.it div{display:flex;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:13px}.it div:last-child{border-bottom:0}.it div span:first-child{flex:1}
.sec{margin:8px 0}.sec b{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}.sec pre{margin:0;white-space:pre-wrap;font:inherit;background:var(--bg);border-radius:6px;padding:6px 10px}
.mute{color:var(--mute)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:50;text-align:center}
.toast.on{opacity:1}
.asgp{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.asgp label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:13px;cursor:pointer;background:var(--bg)}
.asgp label.on{background:var(--pri);border-color:var(--pri);color:#fff}.asgp input{display:none}
.asgform{display:grid;gap:8px;grid-template-columns:150px 1fr 140px 140px 160px auto;align-items:end;margin-top:4px}
.asgform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}.asgform input{width:100%}
.asgform .asgw{flex-direction:row;align-items:center;gap:6px;padding-bottom:6px;white-space:nowrap}.asgform .asgw input{width:auto}
.asgform .asgnote{grid-column:1/-1}
@media (max-width:760px){.asgform{grid-template-columns:1fr 1fr}.asgform label:nth-child(2){grid-column:1/-1}}
.atk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--bg)}
.atk .t1{font-weight:600}.atk .t2{font-size:12px;color:var(--mute);margin:2px 0 4px}.atk .t3{font-size:12px;color:#7a4b00;margin-bottom:4px}
.atk .who{display:inline-block;margin:2px 4px 2px 0;padding:0 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.atk .who.d{background:#d9f2e3;color:#14532d}.atk .who.r{background:#fff0c9;color:#6b4a00}
.atk .act{display:flex;gap:6px;margin-top:6px}.atk .act button{padding:2px 10px;font-size:12px}
/* 矩陣上的特殊事項標記：右上角橘點；預算調整缺批註單：紅點 */
table.mx td.c.hasSp{position:relative}
table.mx td.c.hasSp::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#e8590c}
table.mx td.c.bm::after{background:#d6336c;box-shadow:0 0 0 2px #ffd6e7}
/* 特殊事項清單 */
.spchip{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:14px;border:1px solid var(--line);font-size:12px;cursor:pointer;background:var(--card)}
.spchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.bmchip{border-color:#d6336c;color:#d6336c}.bmchip.on{background:#d6336c;color:#fff}
.splist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.spr{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.spr:last-child{border-bottom:0}.spr:hover{background:var(--bg)}
.spr .sd{flex:none;width:40px;color:var(--mute)}.spr .sn{flex:none;width:64px;font-weight:600}
.spr .stx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spr .stx.mute{color:var(--mute)}

.bmw{flex:none;color:#d6336c;font-size:12px;font-weight:600}
.tag{flex:none;display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;white-space:nowrap;background:var(--bg);border:1px solid var(--line)}
.tag.sp-cust{background:#dbe9fb;color:#133c78}.tag.sp-budget{background:#ffe3c2;color:#6b3300}.tag.sp-award{background:#e9defc;color:#3b1f78}
.tag.sp-bill{background:#d9f2e3;color:#14532d}.tag.sp-qa{background:#cdeff2;color:#0b4a52}.tag.sp-hse{background:#fbd5d0;color:#7a1c12}
.tag.sp-abn{background:#ffd9a8;color:#6b3300}.tag.sp-sug{background:#e6e8ec;color:#3a4350}
@media (max-width:640px){.spr{flex-wrap:wrap}.spr .stx{flex-basis:100%;white-space:normal}}
</style>
</head>
<body>
<header class="top">
 <h1>日報檢視（主管）<small id="who">兆聯實業股份有限公司</small></h1>
 <div class="bar"><a class="btn" href="index.html">← 回到我的日報</a><button id="btnOut" hidden>登出</button></div>
</header>
<main>
 <section class="card" id="loginCard" hidden>
  <h2>登入</h2>
  <div class="lgrow"><label>Email<input id="lgEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
  <label>密碼<input id="lgPwd" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off"></label>
  <button class="pri" id="lgBtn">登入</button></div>
  <div class="err" id="lgErr"></div>
 </section>
 <section class="card" id="msgCard" hidden></section>

 <div id="app" hidden>
  <section class="card">
   <div class="bar">
    <button id="pPrev">‹</button><b id="pTitle" style="min-width:150px;text-align:center"></b><button id="pNext">›</button>
    <button id="pNow">目前這一期</button>
    <span class="sp"></span>
    <input id="q" placeholder="搜尋姓名 / 編號" style="width:150px">
    <select id="sortBy"><option value="emp">依員工編號</option><option value="ot">依加班時數（高到低）</option><option value="late">依逾期未填（多到少）</option></select>
    <button id="btnXls">匯出 Excel</button>
   </div>
   <div class="note" style="margin-top:6px">統計期間為每月 21 日～次月 20 日；顏色與加班規則與工程師端一致。點任一格可查看當天日報內容（唯讀）。</div>
  </section>
  <section class="card" id="alerts"></section>
  <section class="card" id="spCard"></section>
  <section class="card">
   <div class="tblwrap"><table class="mx" id="mx"></table></div>
   <div class="legend">
    <span><i class="st-done">✓</i>已填</span><span><i class="st-leave">假</i>請假</span><span><i class="st-pend">·</i>待補（3 日內）</span>
    <span><i class="st-late">✕</i>逾 3 日未填</span><span><i class="st-ot">加</i>假日出勤</span><span><i class="st-off"></i>假日</span>
    <span>加班：<i class="lv1">46</i><i class="lv2">60</i><i class="lv3">80</i><i class="lv4">100</i> 小時以上</span>
   </div>
  </section>
  <details class="card" id="asgCard">
   <summary><b>📌 指派任務給下屬</b><span class="note">（待辦 / 目標任務：工程師打開網頁時會自動帶入每天的工項）</span></summary>
   <div id="asgBody" style="margin-top:10px">
    <div class="note">① 選擇要指派的人</div>
    <div class="bar" style="margin:4px 0"><button id="asgAll" type="button">全選</button><button id="asgNone" type="button">清除</button><span class="note" id="asgCnt"></span></div>
    <div id="asgPeople" class="asgp"></div>
    <div class="note" style="margin-top:10px">② 任務內容</div>
    <div class="asgform">
     <label>案號<input id="aC" placeholder="P000000000"></label>
     <label>內容<input id="aT" placeholder="例：完成配管試壓、整理設備清冊"></label>
     <label>預計開始<input id="aS" type="date"></label>
     <label>預計結束<input id="aE" type="date"></label>
     <label>完成時進度 %（選填）<input id="aP" type="number" min="0" max="100" placeholder="例：100"></label>
     <label class="asgw"><input id="aW" type="checkbox">含週末與假日</label>
     <label class="asgnote">備註 / 目標說明（工程師看得到）<input id="aN" placeholder="例：驗收前必須完成，需附照片"></label>
    </div>
    <div class="bar" style="margin-top:8px"><button class="pri" id="aAdd" type="button">指派</button><button id="aCancel" type="button" hidden>取消修改</button><span class="note" id="aMsg"></span></div>
    <h2 style="margin:14px 0 4px;font-size:14px">我指派的任務</h2>
    <div id="asgList"></div>
   </div>
  </details>
 </div>
</main>

<div class="toast" id="toast"></div>
<dialog id="dayDlg"><div id="dayBody"></div><div class="bar" style="justify-content:flex-end;margin-top:12px"><button id="dayClose" class="pri">關閉</button></div></dialog>

<script src="config.js"></script>
<script src="supabase.min.js"></script>
<script src="exceljs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3500)};

/* ===== 與工程師端共用的邏輯（由 組建主管頁.ps1 從 index.html 複製，確保算法一致）===== */
const itemText=r=>{const c=(r.c||'').trim(),t=(r.t||'').trim();return c&&t?`${c}_${t}`:(c||t)};
const hasItem=r=>!!itemText(r);
/* 本日請假：f.leave = {type, part(全天/上午/下午), note} */
const leaveText=f=>f&&f.leave?`本日請假（${f.leave.type}${f.leave.part&&f.leave.part!=='全天'?'・'+f.leave.part:''}）${f.leave.note&&f.leave.note.trim()?'　'+f.leave.note.trim():''}`:'';
const leaveFull=f=>!!(f&&f.leave&&f.leave.part==='全天');
const leaveShort=f=>f&&f.leave?`${f.leave.type}${f.leave.part&&f.leave.part!=='全天'?'('+f.leave.part+')':''}`:'';
/* 輸出用的工項清單：請假列在最前面，後面接有填的工項 */
const listItems=dd=>(dd.f&&dd.f.leave?[{c:'',t:leaveText(dd.f),p:'',r:''}]:[]).concat((dd.today||[]).filter(hasItem));
/* 舊資料（整串「P…_內容」存在 t）自動拆成案號 + 內容 */
function migrate(d){
 const fix=r=>{if(r&&r.c===undefined){const m=String(r.t||'').match(/^\s*([A-Za-z]\d{5,}[A-Za-z0-9]*)\s*[_＿]\s*([\s\S]*)$/);r.c=m?m[1]:'';if(m)r.t=m[2]}};
 (d.today||[]).forEach(fix);delete d.tmr;
 const f=d.f;   // 舊版單筆欄位 → 多筆（budgets / awards / bills）
 if(f){
  if(!f.budgets){
   if(f.budget_no||f.budget_t1||f.budget_t2||f.budget_why)f.budgets=[{no:f.budget_no||'',t1:!!f.budget_t1,t2:!!f.budget_t2,why:f.budget_why||''}];
   ['budget_no','budget_t1','budget_t2','budget_why'].forEach(k=>delete f[k]);
  }
  if(!f.awards){
   if(f.award_no||f.award_pr||f.award_item)f.awards=[{no:f.award_no||'',pr:f.award_pr||'',item:f.award_item||''}];
   ['award_no','award_pr','award_item'].forEach(k=>delete f[k]);
  }
  if(!f.bills){
   if(f.bill_no||f.bill_sr)f.bills=[{no:f.bill_no||'',sr:f.bill_sr||''}];
   ['bill_no','bill_sr'].forEach(k=>delete f[k]);
  }
 }
 return d;
}

/* ---------- 各欄位（預算調整…建議事項）的輸出文字；沒內容但勾了「本日無相關事項」就輸出該句 ---------- */
const NONE='本日無相關事項';
const newB=()=>({no:'',t1:false,t2:false,why:'',files:[]});
const tx=v=>!!(v&&String(v).trim());
const newA=()=>({no:'',pr:'',item:''}),newBl=()=>({no:'',sr:'',note:''});
/* 可新增多筆的欄位：預算調整 / 專案發包 / 案件請款 */
const MULTI={
 budget:{k:'budgets',label:'預算調整',nw:newB,has:e=>tx(e.no)||e.t1||e.t2||tx(e.why)||!!(e.files&&e.files.length),
  fmt:e=>`專案編號：${e.no||''}\n調整型式： ${boxC(e.t1)}總預算調整  ${boxC(e.t2)}分項調整\n原因：${e.why||''}${e.files&&e.files.length?`\n異常批註單：${e.files.map(x=>x.name).join('、')}`:''}`},
 award:{k:'awards',label:'專案發包',nw:newA,has:e=>tx(e.no)||tx(e.pr)||tx(e.item),
  fmt:e=>`專案編號：${e.no||''}\n請購單號：${e.pr||''}\n發包項目：${e.item||''}`},
 bill:{k:'bills',label:'案件請款',nw:newBl,has:e=>tx(e.no)||tx(e.sr)||tx(e.note),
  fmt:e=>`案件請款專案編號：${e.no||''}\n※上SR時間：${e.sr||''}${tx(e.note)?`\n備註：${e.note.trim()}`:''}`}
};
const SEC={budget:['budgets'],award:['awards'],bill:['bills'],qa:['qa'],hse:['hse'],abn:['abn'],cust:['cust','att'],sug:['sug']};
const BLANK={budget:'專案編號：\n調整型式： □總預算調整  □分項調整\n原因：',award:'專案編號：\n請購單號：\n發包項目：',bill:'案件請款專案編號：\n※上SR時間：\n'};
const boxC=b=>b?'■':'□';
const custText=f=>[f.cust||'',(f.att&&f.att.length)?'附件：'+f.att.map(a=>a.name).join('、'):''].filter(Boolean).join('\n');
const secHas=(f,k)=>MULTI[k]?(f[MULTI[k].k]||[]).some(MULTI[k].has):SEC[k].some(x=>Array.isArray(f[x])?f[x].length:(typeof f[x]==='string'?f[x].trim():f[x]));
function secOut(f,k){
 if(secHas(f,k)){
  const M=MULTI[k];
  if(M){
   const L=f[M.k].filter(M.has);
   return L.map((e,i)=>`${L.length>1?`【第 ${i+1} 筆】\n`:''}${M.fmt(e)}`).join('\n\n');
  }
  if(k==='cust')return custText(f);
  return String(f[k]).trim();
 }
 return f['none_'+k]?NONE:'';
}
const secExport=(f,k)=>secOut(f,k)||BLANK[k]||'';
const HOL={
 '2026-01-01':'元旦',
 '2026-02-14':'春節','2026-02-15':'春節','2026-02-16':'除夕','2026-02-17':'春節','2026-02-18':'春節','2026-02-19':'春節','2026-02-20':'春節','2026-02-21':'春節','2026-02-22':'春節',
 '2026-02-27':'和平紀念日補假','2026-02-28':'和平紀念日',
 '2026-04-03':'兒童節補假','2026-04-04':'兒童節','2026-04-05':'清明節','2026-04-06':'清明節補假',
 '2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節',
 '2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'光復節補假','2026-12-25':'行憲紀念日'
};
const MAKEUP={'2026-02-07':'補班'};
const WD='日一二三四五六';
let filled={},leaves={},extraHol={},extraWork=new Set();
const loadedMonths=new Set();
const cal={y:0,m:0};
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isWork=s=>{if(extraWork.has(s)||MAKEUP[s])return true;if(HOL[s]||extraHol[s])return false;const w=parseD(s).getDay();return w!==0&&w!==6};
const offName=s=>HOL[s]||extraHol[s]||'';
const hasContent=j=>(j.today||[]).some(hasItem)||!!(j.f&&j.f.leave);

const OT_START=8*60+30,OT_END=18*60,OT_BREAKS=[[12*60,13*60],[17*60+30,18*60]];
const OT_LV=[[100,4],[80,3],[60,2],[46,1]];
const OT_TXT={1:'已超出 46 小時',2:'已超出 60 小時',3:'已超出 80 小時',4:'已超出 100 小時'};
const OT_UNIT=30;   // 加班以 0.5 小時（30 分鐘）為單位；每天各自計算，不足 30 分鐘不計（要改成四捨五入，把下方 Math.floor 改成 Math.round）
const OT_RULE='08:30～12:00、13:00～17:30 為工作時間；17:30～18:00 晚休不計，18:00 後算加班；以 0.5 小時為單位，不足 30 分鐘不計';
const otDay={};let otState=null;
const tmin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m};
const fmtH=h=>`${Math.round(h*10)/10} 小時`;
const ovl=(a,b,x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x));
function otHours(f,d){
 if(!f||!f.tIn||!f.tOff||leaveFull(f))return 0;
 const a=tmin(f.tIn),b=tmin(f.tOff);if(isNaN(a)||isNaN(b)||b<=a)return 0;
 const min=isWork(d)
  ?ovl(a,b,-Infinity,OT_START)+ovl(a,b,OT_END,Infinity)                       // 上班日：08:30 前 + 18:00 後
  :(b-a)-OT_BREAKS.reduce((n,[x,y])=>n+ovl(a,b,x,y),0);                       // 假日出勤：全部時數扣掉休息時段
 return Math.floor(Math.max(0,min)/OT_UNIT)*OT_UNIT/60;       // 以 0.5 小時為單位
}
function otPeriod(d){
 const[y,m,dd]=d.split('-').map(Number);let sy=y,sm=m;
 if(dd<21){sm--;if(sm<1){sm=12;sy--}}
 let ey=sy,em=sm+1;if(em>12){em=1;ey++}
 return{start:`${sy}-${pad(sm)}-21`,end:`${ey}-${pad(em)}-20`,months:[[sy,sm],[ey,em]]};
}

function periodOf(d){const p=otPeriod(d);return{start:p.start,end:p.end}}
function shiftPeriod(p,k){let[y,m]=p.start.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return periodOf(`${y}-${pad(m)}-25`)}
function daysOf(p){const out=[];for(const d=parseD(p.start);fmtD(d)<=p.end;d.setDate(d.getDate()+1))out.push(fmtD(d));return out}

/* ---------- 計算每人每天狀態 ---------- */
const DAYS=864e5;
function compute(){
 const days=daysOf(period),today=todayStr(),t0=parseD(today);
 rowsData=people.map(p=>{
  const rec=byEmp[p.emp]||{};
  const firstFilled=days.find(d=>rec[d]&&hasContent(rec[d]));
  const start=p.start_date||firstFilled||null;           // 起算日：指定日 > 本期第一筆有填的日期
  let ot=0,done=0,late=0,pend=0,leave=0;
  const cells=days.map(d=>{
   const r=rec[d],has=!!(r&&hasContent(r)),w=isWork(d);
   if(has){const h=otHours(r.f,d);ot+=h;
    const sp=SPECIAL_LIST.filter(([k])=>secHas(r.f||{},k)).map(x=>x[0]);                       // 當天「實際有填」的特殊事項
    const bm=((r.f&&r.f.budgets)||[]).some(b=>(tx(b.no)||b.t1||b.t2||tx(b.why))&&!(b.files&&b.files.length));  // 預算調整缺異常批註單
    if(r.f&&r.f.leave){leave+=r.f.leave.part==='全天'?1:.5;if(w)done+= r.f.leave.part==='全天'?0:1;return{d,st:'leave',h,sp,bm}}
    if(!w)return{d,st:'ot',h,sp,bm};
    done++;return{d,st:'done',h,sp,bm}}
   if(!w)return{d,st:'off',h:0};
   if(start==null||d<start)return{d,st:'na',h:0};
   if(d>=today)return{d,st:'future',h:0};
   const age=Math.round((t0-parseD(d))/DAYS);
   if(age>3){late++;return{d,st:'late',h:0}}
   pend++;return{d,st:'pend',h:0};
  });
  const spDays=cells.filter(c=>c.sp&&c.sp.length).length,bmCount=cells.filter(c=>c.bm).length;
  return{p,cells,ot,done,late,pend,leave,start,spDays,bmCount};
 });
}
const lvOf=h=>(OT_LV.find(([t])=>h>t)||[0,0])[1];
const SYM={done:'✓',leave:'假',late:'✕',pend:'·',ot:'加',off:'',na:'–',future:''};

/* ---------- 特殊事項清單：本期內有人實際填寫的客戶協定 / 預算調整 / 專案發包 / 案件請款 / 品質 / 工安 / 異常 / 建議 ---------- */
let spFilter='';
function renderSpecial(L){
 const entries=[];
 for(const r of L)for(const c of r.cells){
  if(!c.sp||!c.sp.length)continue;
  const rec=(byEmp[r.p.emp]||{})[c.d];if(!rec)continue;
  for(const k of c.sp)entries.push({p:r.p,date:c.d,k,text:secOut(rec.f||{},k),bm:k==='budget'&&c.bm});
 }
 const cnt={};SPECIAL_LIST.forEach(([k])=>cnt[k]=0);entries.forEach(e=>cnt[e.k]++);
 const bmN=entries.filter(e=>e.bm).length;
 const chips=`<span class="spchip ${spFilter===''?'on':''}" data-sp="">全部 ${entries.length}</span>`+
  SPECIAL_LIST.map(([k,t])=>`<span class="spchip sp-${k} ${spFilter===k?'on':''}" data-sp="${k}">${t} ${cnt[k]}</span>`).join('')+
  (bmN?`<span class="spchip bmchip ${spFilter==='__bm'?'on':''}" data-sp="__bm">⚠ 預算調整缺批註單 ${bmN}</span>`:'');
 const list=entries.filter(e=>!spFilter||(spFilter==='__bm'?e.bm:e.k===spFilter)).sort((a,b)=>b.date.localeCompare(a.date)||a.p.emp.localeCompare(b.p.emp));
 const s=x=>`${+x.slice(5,7)}/${+x.slice(8)}`;
 const rows=list.slice(0,300).map(e=>`<div class="spr" data-emp="${esc(e.p.emp)}" data-date="${e.date}">
   <span class="sd">${s(e.date)}</span><span class="sn">${esc(e.p.name)}</span><span class="tag sp-${e.k}">${SPL[e.k]}</span>
   <span class="stx${e.text===NONE?' mute':''}">${esc(e.text.replace(/\n+/g,' ／ ').slice(0,110))}</span>${e.bm?'<span class="bmw">⚠ 缺異常批註單</span>':''}</div>`).join('');
 $('#spCard').innerHTML=`<h2 style="margin:0 0 6px">📌 特殊事項（本期有填寫）</h2><div class="chips">${chips}</div>`+
  (list.length?`<div class="splist">${rows}</div>${list.length>300?`<div class="note">僅顯示最近 300 筆</div>`:''}`:'<div class="note" style="margin:8px 0">這一期沒有符合的特殊事項。</div>');
}

$('#asgPeople').addEventListener('change',e=>{const c=e.target.closest('[data-ae]');if(!c)return;c.checked?asgSel.add(c.dataset.ae):asgSel.delete(c.dataset.ae);renderAsgPeople()});
$('#asgAll').onclick=()=>{if(asgEdit)return;people.filter(p=>p.emp!==me.emp).forEach(p=>asgSel.add(p.emp));renderAsgPeople()};
$('#asgNone').onclick=()=>{if(asgEdit)return;asgSel.clear();renderAsgPeople()};
async function loadAssigned(){
 const{data:r,error}=await sb.from('todos').select('*').eq('assigned_by',me.emp).order('start_date');
 if(error){asgErr=/column|relation|schema cache|PGRST/i.test(error.message)?'尚未啟用指派功能：請先在資料庫執行「更新_指派任務.sql」（需先有「更新_待辦事項.sql」）。':'讀取失敗：'+error.message;myTasks=[]}
 else{asgErr='';myTasks=r||[]}
 renderAssigned();
}
function renderAssigned(){
 const box=$('#asgList');
 if(asgErr){box.innerHTML=`<div class="err">⚠ ${esc(asgErr)}</div>`;return}
 if(!myTasks.length){box.innerHTML='<div class="note">還沒有指派過任務。</div>';return}
 const groups=new Map();
 for(const t of myTasks){const k=[t.c,t.t,t.start_date,t.end_date,t.weekends,t.p1,t.note].join('|');(groups.get(k)||groups.set(k,[]).get(k)).push(t)}
 const s=x=>`${+x.slice(5,7)}/${+x.slice(8)}`,nm=Object.fromEntries(people.map(p=>[p.emp,p.name]));
 box.innerHTML=[...groups.values()].sort((a,b)=>b[0].start_date.localeCompare(a[0].start_date)).map(g=>{
  const t=g[0],done=g.filter(x=>x.done).length;
  return`<div class="atk"><div class="t1">${esc(itemText(t))||'（未命名）'}</div>
   <div class="t2">${s(t.start_date)}～${s(t.end_date)}${t.weekends?'・含週末':''}${t.p1!=null?`・完成時 ${t.p1}%`:''}・完成 ${done} / ${g.length} 人</div>
   ${t.note?`<div class="t3">備註：${esc(t.note)}</div>`:''}
   <div>${g.map(x=>`<span class="who ${x.done?'d':'r'}">${esc(nm[x.emp]||x.emp)}${x.done?' ✓完成':' 進行中'}</span>`).join('')}</div>
   <div class="act"><button type="button" data-aedit="${g.map(x=>x.id).join(',')}">編輯</button><button type="button" data-adel="${g.map(x=>x.id).join(',')}">刪除</button></div></div>`}).join('');
}
async function asgSave(){
 if(asgBusy)return;
 const c=$('#aC').value.trim(),t=$('#aT').value.trim(),s=$('#aS').value,e=$('#aE').value,w=$('#aW').checked,note=$('#aN').value.trim();
 let p=$('#aP').value.trim();p=p===''?null:Math.max(0,Math.min(100,Math.round(+p)));
 if(!c&&!t){$('#aMsg').textContent='請填寫案號或內容';return}
 if(!s||!e){$('#aMsg').textContent='請選擇預計開始與結束日';return}
 if(e<s){$('#aMsg').textContent='結束日不能早於開始日';return}
 if(!asgEdit&&!asgSel.size){$('#aMsg').textContent='請先選擇要指派的人';return}
 asgBusy=true;$('#aAdd').disabled=true;$('#aMsg').textContent='處理中…';
 try{
  const f={c,t,start_date:s,end_date:e,weekends:w,p1:p,note:note||null};
  if(asgEdit){const{error}=await sb.from('todos').update(f).in('id',asgEdit);if(error)throw error;$('#aMsg').textContent='';toast('已更新任務（工程師下次打開網頁時會同步）')}
  else{
   const rows=[...asgSel].map(emp=>Object.assign({emp,assigned_by:me.emp,assigned_by_name:me.name},f));
   const{error}=await sb.from('todos').insert(rows);if(error)throw error;
   toast(`已指派給 ${rows.length} 人（他們下次打開網頁時會收到並自動帶入每日工項）`);
  }
  asgForm();await loadAssigned();
 }catch(err){
  $('#aMsg').textContent='失敗：'+(/row-level security/i.test(err.message)?'你沒有權限指派給所選人員（只能指派給自己的下屬）':err.message);
 }finally{asgBusy=false;$('#aAdd').disabled=false}
}
$('#aAdd').onclick=asgSave;$('#aCancel').onclick=asgForm;
document.addEventListener('click',async e=>{
 const ed=e.target.closest('[data-aedit]'),dl=e.target.closest('[data-adel]');
 if(ed){
  const ids=ed.dataset.aedit.split(','),t=myTasks.find(x=>x.id===ids[0]);if(!t)return;
  asgEdit=ids;asgSel=new Set(myTasks.filter(x=>ids.includes(x.id)).map(x=>x.emp));
  $('#aC').value=t.c;$('#aT').value=t.t;$('#aS').value=t.start_date;$('#aE').value=t.end_date;$('#aP').value=t.p1==null?'':t.p1;$('#aW').checked=!!t.weekends;$('#aN').value=t.note||'';
  $('#aAdd').textContent='儲存修改';$('#aCancel').hidden=false;$('#aMsg').textContent='編輯中';renderAsgPeople();$('#aC').scrollIntoView({block:'center'});return;
 }
 if(dl){
  const ids=dl.dataset.adel.split(','),t=myTasks.find(x=>x.id===ids[0]);if(!t)return;
  if(!confirm(`要刪除任務「${itemText(t)}」嗎？（共 ${ids.length} 人）\n工程師下次打開網頁時，今天以後由它帶入的工項會被移除；今天與過去的保留。`))return;
  const{error}=await sb.from('todos').delete().in('id',ids);
  if(error){toast('刪除失敗：'+error.message);return}
  toast('已刪除任務');if(asgEdit&&asgEdit.some(i=>ids.includes(i)))asgForm();await loadAssigned();
 }
});

boot();
</script>
</body>
</html>
